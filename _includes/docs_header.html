<div class="docs-header" id="content">
  <div class="container">
    {% if page.title %}
      <h1>{{ site.motto }}</h1>
    {% else %}
      <h1>{{ site.name }}</h1>
    {% endif %}
  </div>
</div>
<div class="docs-motto-strip">
  <div class="container">
    {% if page.title %}
      <p>{{ site.banner }}</p>
    {% else %}
      <p>{{ site.description }}</p>
    {% endif %}
  </div>
</div>
